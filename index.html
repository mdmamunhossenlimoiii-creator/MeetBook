<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1877f2">
  <meta name="description" content="MeetBook — connect with friends, share moments, chat and discover communities.">
  <meta name="application-name" content="MeetBook">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MeetBook">
  <meta property="og:title" content="MeetBook">
  <meta property="og:description" content="Connect with friends, share moments, chat and discover communities on MeetBook.">
  <meta property="og:url" content="https://mdmamunhossenlimoiii-creator.github.io/MeetBook/">
  <link rel="canonical" href="https://mdmamunhossenlimoiii-creator.github.io/MeetBook/">
  <link rel="manifest" href="manifest.webmanifest">
  <title>MeetBook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231877f2'/%3E%3Ctext x='32' y='44' font-size='36' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a light flash.
    try {
      var p = localStorage.getItem('meetbook-theme') || 'system';
      var dark = p === 'dark' || (p === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><div class="splash">MeetBook</div></div>
  <noscript><p style="padding:24px">MeetBook needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
