name: MeetBook encrypted backup

# Manual-only by design. A human must explicitly confirm each production backup run.
# Requires MeetBook-only repository secrets:
#   FIREBASE_SERVICE_ACCOUNT, MEETBOOK_FIREBASE_PROJECT_ID, BACKUP_PASSPHRASE
on:
  workflow_dispatch:
    inputs:
      confirm_backup:
        description: "I authorize a backup of the configured MeetBook Firebase project"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backup:
    if: ${{ inputs.confirm_backup == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate MeetBook backup configuration and create encrypted backup
        run: node scripts/backup.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MEETBOOK_FIREBASE_PROJECT_ID: ${{ secrets.MEETBOOK_FIREBASE_PROJECT_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        if: hashFiles('backup-out/*') != ''
        with:
          name: meetbook-backup-encrypted
          path: backup-out/
          retention-days: 30
