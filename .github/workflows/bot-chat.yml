name: MeetBook Bot Chat (manual)

on:
  workflow_dispatch:
    inputs:
      bot_id:
        description: "Choose exactly one of the first three Gemini bots"
        required: true
        type: choice
        options: [bot_01, bot_02, bot_03]
      dry_run:
        description: "Preflight only: verify runner authentication and project guard; exits safely if bots are OFF"
        required: true
        type: boolean
        default: true
      confirm_live:
        description: "Allow one reply to an existing user-initiated bot chat (requires environment approval and BOT_LIVE_TEST_APPROVED=yes)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: meetbook-bot-chat
  cancel-in-progress: false

jobs:
  reply-once:
    if: ${{ inputs.dry_run == true || inputs.confirm_live == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: meetbook-bot-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require owner release flag for a live reply
        if: ${{ inputs.dry_run != true }}
        env:
          LIVE_APPROVED: ${{ vars.BOT_LIVE_TEST_APPROVED }}
        run: |
          test "$LIVE_APPROVED" = "yes" || { echo "Live test blocked: set BOT_LIVE_TEST_APPROVED=yes only after reviewing the release checklist."; exit 1; }
      - name: Validate required environment configuration without printing secrets
        env:
          RUNNER_EMAIL: ${{ secrets.BOT_RUNNER_EMAIL }}
          RUNNER_PASSWORD: ${{ secrets.BOT_RUNNER_PASSWORD }}
          EXPECTED_PROJECT: ${{ vars.BOT_RUNNER_EXPECTED_PROJECT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          test -n "$RUNNER_EMAIL" || { echo "Missing BOT_RUNNER_EMAIL environment secret."; exit 1; }
          test -n "$RUNNER_PASSWORD" || { echo "Missing BOT_RUNNER_PASSWORD environment secret."; exit 1; }
          test "$EXPECTED_PROJECT" = "meetbook-65d30" || { echo "BOT_RUNNER_EXPECTED_PROJECT_ID must equal meetbook-65d30."; exit 1; }
          if [ "$DRY_RUN" = "0" ]; then
            test -n "$GEMINI_KEY" || { echo "Missing GEMINI_API_KEY environment secret."; exit 1; }
          fi
      - name: Process at most one user-initiated chat request
        env:
          BOT_RUNNER_EMAIL: ${{ secrets.BOT_RUNNER_EMAIL }}
          BOT_RUNNER_PASSWORD: ${{ secrets.BOT_RUNNER_PASSWORD }}
          BOT_RUNNER_EXPECTED_PROJECT_ID: ${{ vars.BOT_RUNNER_EXPECTED_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_RUNNER_MODE: chat
          GEMINI_STRICT: ${{ inputs.dry_run && '0' || '1' }}
          BOT_RUNNER_BOT_ID: ${{ inputs.bot_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/bot-runner.mjs
