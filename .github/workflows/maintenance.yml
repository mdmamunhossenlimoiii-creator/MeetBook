name: Account deletion queue (disabled pending owner review)

# SAFETY: This workflow can permanently delete Firebase Authentication users and Firestore data.
# It is intentionally disabled until the owner completes MeetBook Firebase setup and explicitly
# authorizes a separately reviewed deletion workflow.
on: []

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Account deletion automation is disabled pending explicit owner authorization."
